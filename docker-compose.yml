services:

  # PHP-FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ocenka_laravel_php
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=localhost
    depends_on:
      - postgres

  # Nginx веб-сервер
  nginx:
    image: nginx:alpine
    container_name: ocenka_laravel_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - postgres

  # Postgres база данных
  postgres:
    image: postgres:15-alpine
    container_name: ocenka_laravel_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ocenka
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ocenka" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: ocenka_laravel_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  # Логин для pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin           # Пароль для pgAdmin
    ports:
      - "5050:80"  # Веб-интерфейс pgAdmin будет на http://localhost:5050
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-sessions:/var/lib/pgadmin/sessions
    depends_on:
      - postgres
    user: "5050:5050"  # Явно указываем пользователя

  # Node.js для React
  node:
    image: node:20-alpine
    container_name: ocenka_laravel_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"  # Vite порт

  mailer:
    image: mailhog/mailhog
    container_name: ocenka_laravel_mailer
    ports:
      - "8181:8025"

  redis:
    image: redis/redis-stack:latest
    container_name: ocenka_laravel_redis
    ports:
      - "6379:6379"  # Redis порт для приложений
      - "8001:8001"  # Веб-интерфейс для браузера
    #environment:
    #  - "REDIS_USERNAME=user"
    #  - "REDIS_PASSWORD=password"
    #  - "REDIS_DISABLE_DEFAULT_USER=true"
